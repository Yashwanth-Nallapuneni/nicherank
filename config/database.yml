# The app reads Suhruth's Neon database through DATABASE_URL (read-only role).
# Never commit that URL. Tests use a local writable PostgreSQL with pgvector.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://postgres:postgres@localhost:5434/nicherank_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
